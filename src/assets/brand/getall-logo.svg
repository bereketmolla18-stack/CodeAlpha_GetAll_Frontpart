<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for the Circle -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <!-- Accent Gradient for Text/Shapes -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <!-- Circular Background -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGrad)" />
  
  <!-- Inner White Shield/Badge background for contrast -->
  <circle cx="100" cy="100" r="82" fill="#FFFFFF" />

  <!-- Center Icon: Shopping Bag with Checkmark -->
  <g transform="translate(63, 40)">
    <!-- Bag Body -->
    <rect x="6" y="20" width="62" height="52" rx="10" fill="url(#bgGrad)" />
    <!-- Bag Handles -->
    <path d="M22 20 V14 C22 8, 52 8, 52 14 V20" fill="none" stroke="#3B82F6" stroke-width="5" stroke-linecap="round" />
    <!-- Checkmark -->
    <path d="M23 48 L33 58 L52 36" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Curved Text or Stacked Text Inside Circle -->
  <text x="100" y="138" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" text-anchor="middle" letter-spacing="2">
    <tspan fill="#1E293B">GET</tspan><tspan fill="url(#accentGrad)">ALL</tspan>
  </text>
  
  <!-- Small dot accent at the bottom -->
  <circle cx="100" cy="155" r="3" fill="#10B981" />
</svg>
